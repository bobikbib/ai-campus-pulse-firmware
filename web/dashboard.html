<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Pulse — комнаты</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --card:#fff; --muted:#5b6570; --line:#d8dde3; --accent:#0b6bcb;
          --occ:#c0392b; --free:#1e8e3e; --na:#8a6d00; --track:#e3e7ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --fg:#e8eaed; --card:#1d2125; --muted:#9aa4af; --line:#2f353b; --accent:#5aa9ff;
            --occ:#ff6b5e; --free:#4cc26b; --na:#e0b94a; --track:#2f353b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; }
  main { max-width:1000px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 12px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; }
  .room { font-size:1.3rem; font-weight:700; }
  .status { font-weight:700; }
  .occupied { color:var(--occ); } .empty { color:var(--free); } .na { color:var(--na); }
  .people { font-size:2.2rem; font-weight:700; margin:4px 0; }
  .bar { height:8px; background:var(--track); border-radius:4px; overflow:hidden; margin:4px 0 8px; }
  .bar > div { height:100%; background:var(--accent); }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; background:var(--occ); color:#fff; font-size:.85rem; margin:4px 0; }
  .row { display:flex; justify-content:space-between; gap:8px; font-size:.95rem; margin-top:6px; }
  .muted { color:var(--muted); font-size:.85rem; }
  #empty { color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Комнаты</h1>
  <div id="grid"></div>
  <p id="empty" hidden>Пока нет данных. Запустите <a href="/sensor">страницу датчика</a> и нажмите «Старт».</p>
  <p id="err" class="muted" hidden>Сервер не отвечает.</p>
</main>
<script>
const RELEASE_S = 2700; // 45 min: booking would be released

const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const mmss = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

function card(r) {
  const c = el('div', 'card');
  const ok = r.sensor === 'ok' && r.status !== 'no data';
  const head = el('div', 'head');
  head.append(el('span', 'room', r.room));
  let label, cls;
  if (!ok) { label = 'Датчик недоступен'; cls = 'na'; }
  else if (r.occupied) { label = 'Занято'; cls = 'occupied'; }
  else { label = 'Свободно'; cls = 'empty'; }
  head.append(el('span', 'status ' + cls, label));
  c.append(head);

  if (ok) {
    c.append(el('div', 'people', r.people_count + ' чел.'));
    if (r.empty_for_s > 0 && r.empty_for_s < RELEASE_S) {
      c.append(el('div', 'muted', 'Пусто уже ' + mmss(r.empty_for_s) + ' из 45:00'));
      const bar = el('div', 'bar'), fill = el('div');
      fill.style.width = (100 * r.empty_for_s / RELEASE_S).toFixed(1) + '%';
      bar.append(fill); c.append(bar);
    } else if (r.empty_for_s >= RELEASE_S) {
      c.append(el('div', 'badge', 'бронь была бы снята'));
      c.append(el('div', 'muted', 'Пусто уже ' + mmss(r.empty_for_s)));
    }
  } else {
    c.append(el('div', 'muted', 'Нет надёжных данных от датчика (' + r.sensor + ')'));
  }

  // noise
  const nrow = el('div', 'row');
  nrow.append(el('span', '', 'Шум'), el('span', '', r.noise_db === null ? 'нет данных' : String(r.noise_db)));
  c.append(nrow);
  const nbar = el('div', 'bar'), nfill = el('div');
  nfill.style.width = (r.noise_db === null ? 0 : Math.min(100, r.noise_db / 1.2)) + '%';
  nbar.append(nfill); c.append(nbar);

  const vrow = el('div', 'row');
  vrow.append(el('span', '', 'Голос'),
    el('span', '', r.voice === null ? 'нет данных' : (r.voice ? 'речь слышна' : 'тихо')));
  c.append(vrow);

  const srow = el('div', 'row');
  srow.append(el('span', '', 'Датчик'), el('span', '', r.sensor));
  c.append(srow);
  c.append(el('div', 'muted', 'обновлено ' + r.last_seen_s + ' с назад'));
  return c;
}

async function poll() {
  try {
    const res = await fetch('/api/rooms', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const rooms = await res.json();
    $grid.replaceChildren(...rooms.map(card));
    $empty.hidden = rooms.length > 0;
    $err.hidden = true;
  } catch (e) {
    $err.hidden = false;
  }
}
const $grid = document.getElementById('grid'), $empty = document.getElementById('empty'), $err = document.getElementById('err');
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
